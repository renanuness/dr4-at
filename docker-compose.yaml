services:
  eureka-server:
    build:
      dockerfile: Dockerfile-eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - freela-net
  
  api-gateway:
    build:
      dockerfile: Dockerfile-gateway
    container_name: api-gateway
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    networks:
      - freela-net
    
  auditoria-service:
    build:
      dockerfile: Dockerfile-auditoria
    container_name: auditoria-service
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres:5432/auditoria_db
      - DB_USER=freela
      - DB_PASSWORD=freela
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8084:8084"
    networks:
      - freela-net
    
  contrato-service:
    build:
      dockerfile: Dockerfile-contrato
    container_name: contrato-service
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres:5432/contrato_db
      - DB_USER=freela
      - DB_PASSWORD=freela
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    networks:
      - freela-net
    
  notificacao-service:
    build:
      dockerfile: Dockerfile-notificacao
    container_name: notificacao-service
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres:5432/notificacao_db
      - DB_USER=freela
      - DB_PASSWORD=freela
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8082:8082"
    networks:
      - freela-net

  reputacao-service:
    build:
      dockerfile: Dockerfile-reputacao
    container_name: reputacao-service
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres:5432/reputacao_db
      - DB_USER=freela
      - DB_PASSWORD=freela
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8083:8083"
    networks:
      - freela-net
  postgres:
    image: postgres:16
    container_name: freela-postgres
    environment:
      POSTGRES_USER: freela
      POSTGRES_PASSWORD: freela
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freela -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [freela-net]

  kafka:
    image: apache/kafka:4.2.1
    container_name: freela-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [freela-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: freela-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: freela-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    networks: [freela-net]

volumes:
  postgres_data:

networks:
  freela-net:
    name: freela-net
    driver: bridge